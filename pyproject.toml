[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "touchgrass-fc"
version = "0.1.0"
description = "Telegram group bot that turns availability chatter into a real-life football match"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "apscheduler>=3.10",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
touchgrass = "touchgrass.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["touchgrass*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
